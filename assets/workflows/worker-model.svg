<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="model-policy-title model-policy-desc"><title id="model-policy-title">worker 모델 · 선택은 한 번, 호출은 명시적으로</title><desc id="model-policy-desc">개발 모델 정책을 실행 시 확정하고, 계획 결함과 모델 역량 부족을 구분한다.</desc><style>text{font-family:Geist,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}.mono{font-family:"Geist Mono","Cascadia Code",monospace}</style><defs><marker id="model-policy-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="model-policy-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="model-policy-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="model-policy-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><path data-from="needs" data-to="policy" d="M 360 108 L 480 108" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#model-policy-arrow-default)"/><path data-from="policy" data-to="choose" d="M 760 108 L 880 108" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#model-policy-arrow-default)"/><path data-from="policy" data-to="verify" d="M 620 152 L 620 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#model-policy-arrow-default)"/><path data-from="choose" data-to="verify" d="M 1020 152 L 1020 200 Q 1020 208 1012 208 L 708 208 Q 700 208 700 216 L 700 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#model-policy-arrow-default)"/><path data-from="verify" data-to="worker" d="M 760 296 L 880 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#model-policy-arrow-default)"/><path data-from="worker" data-to="result" d="M 1020 340 L 1020 432" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#model-policy-arrow-default)"/><path data-from="result" data-to="done" d="M 1020 528 L 1020 568" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#model-policy-arrow-default)"/><path data-from="result" data-to="return" d="M 924 480 L 760 480" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#model-policy-arrow-default)"/><path data-from="result" data-to="upgrade" d="M 1116 480 L 1232 480 Q 1240 480 1240 488 L 1240 648 Q 1240 656 1232 656 L 228 656 Q 220 656 220 648 L 220 536" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#model-policy-arrow-default)"/><path data-from="upgrade" data-to="verify" d="M 220 440 L 220 304 Q 220 296 228 296 L 480 296" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#model-policy-arrow-default)"/><g class="edge-label"><rect x="784" y="80" width="72" height="20" rx="2" fill="#f5f5f5"/><text x="820" y="96" font-size="12" text-anchor="middle" fill="#4f5d75">선택 없음</text></g><g class="edge-label"><rect x="540" y="196" width="72" height="20" rx="2" fill="#f5f5f5"/><text x="576" y="212" font-size="12" text-anchor="middle" fill="#4f5d75">선택 있음</text></g><g class="edge-label"><rect x="1028" y="532" width="40" height="20" rx="2" fill="#f5f5f5"/><text x="1048" y="548" font-size="12" text-anchor="middle" fill="#4f5d75">통과</text></g><g class="edge-label"><rect x="788" y="452" width="104" height="20" rx="2" fill="#f5f5f5"/><text x="840" y="468" font-size="12" text-anchor="middle" fill="#4f5d75">요구·계획·환경</text></g><g class="edge-label"><rect x="548" y="628" width="104" height="20" rx="2" fill="#f5f5f5"/><text x="600" y="644" font-size="12" text-anchor="middle" fill="#4f5d75">모델 역량 부족</text></g><g data-node="needs"><rect x="80" y="64" width="280" height="88" rx="6" fill="#f5f5f5"/><rect x="80" y="64" width="280" height="88" rx="6" fill="#fff" stroke="#2d3142"/><text x="220.0" y="96" font-size="16" text-anchor="middle" fill="#2d3142">계획의 역량 요구</text><text x="220.0" y="136" font-size="12" text-anchor="middle" fill="#4f5d75">위험·도구·문맥·모호성</text></g><g data-node="policy"><rect x="480" y="64" width="280" height="88" rx="6" fill="#f5f5f5"/><rect x="480" y="64" width="280" height="88" rx="6" fill="#fff" stroke="#2d3142"/><text x="620.0" y="96" font-size="16" text-anchor="middle" fill="#2d3142">worker 모델 정책 확인</text><text x="620.0" y="136" font-size="12" text-anchor="middle" fill="#4f5d75">옵션 → 재개 → 기본값</text></g><g data-node="choose"><rect x="880" y="64" width="280" height="88" rx="6" fill="#f5f5f5"/><rect x="880" y="64" width="280" height="88" rx="6" fill="#fff" stroke="#2d3142"/><text x="1020.0" y="96" font-size="16" text-anchor="middle" fill="#2d3142">없을 때 한 번 선택</text><text x="1020.0" y="136" font-size="12" text-anchor="middle" fill="#4f5d75">실제 가용한 후보만 추천</text></g><g data-node="verify"><rect x="480" y="252" width="280" height="88" rx="6" fill="#f5f5f5"/><rect x="480" y="252" width="280" height="88" rx="6" fill="#fff" stroke="#2d3142"/><text x="620.0" y="284" font-size="16" text-anchor="middle" fill="#2d3142">모델·호스트 설정 대조</text><text x="620.0" y="324" font-size="12" text-anchor="middle" fill="#4f5d75">모델 ID·effort·고정값 충돌</text></g><g data-node="worker"><rect x="880" y="252" width="280" height="88" rx="6" fill="#f5f5f5"/><rect x="880" y="252" width="280" height="88" rx="6" fill="#fff" stroke="#2d3142"/><text x="1020.0" y="284" font-size="16" text-anchor="middle" fill="#2d3142">선택 모델로 개발 위임</text><text x="1020.0" y="324" font-size="12" text-anchor="middle" fill="#4f5d75">허브 모델 상속 방지</text></g><g data-node="result"><polygon points="1020,432 1116,480 1020,528 924,480" fill="#f5f5f5" stroke="#eb6c36"/><text x="1020" y="476" font-size="16" text-anchor="middle" fill="#2d3142">결과·막힘 분류</text><text x="1020" y="500" font-size="12" text-anchor="middle" fill="#4f5d75">실제 근거로 진단</text></g><g data-node="return"><rect x="480" y="440" width="280" height="96" rx="6" fill="#f5f5f5"/><rect x="480" y="440" width="280" height="96" rx="6" fill="#fff" stroke="#2d3142"/><text x="620.0" y="472" font-size="16" text-anchor="middle" fill="#2d3142">요구·계획·환경</text><text x="620.0" y="492" font-size="16" text-anchor="middle" fill="#2d3142">해당 소유자에게 반환</text><text x="620.0" y="520" font-size="12" text-anchor="middle" fill="#4f5d75">허브가 정본을 대신 수정하지 않음</text></g><g data-node="upgrade"><rect x="80" y="440" width="280" height="96" rx="6" fill="#f5f5f5"/><rect x="80" y="440" width="280" height="96" rx="6" fill="#fff" stroke="#2d3142"/><text x="220.0" y="472" font-size="16" text-anchor="middle" fill="#2d3142">허용된 모델로 재배정</text><text x="220.0" y="520" font-size="12" text-anchor="middle" fill="#4f5d75">원인 진단 · 새 attempt</text></g><g data-node="done"><rect x="880" y="568" width="280" height="64" rx="6" fill="#f5f5f5"/><rect x="880" y="568" width="280" height="64" rx="6" fill="#fff" stroke="#2d3142"/><text x="1020.0" y="600" font-size="16" text-anchor="middle" fill="#2d3142">리뷰·검증으로 수용</text><text x="1020.0" y="616" font-size="12" text-anchor="middle" fill="#4f5d75">실제 결과·모델 근거 기록</text></g><line x1="40" y1="672" x2="1240" y2="672" stroke="#bfc0c0"/><text x="40" y="700" font-size="12" text-anchor="start" fill="#4f5d75">실선: 처리·인계  /  점선: 선택·복귀·응답  /  주황: 핵심 판단 또는 결과</text></svg>
