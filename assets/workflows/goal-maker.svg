<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="goal-title goal-desc"><title id="goal-title">goal-maker · 단계 사이에는 수렴 배리어</title><desc id="goal-desc">합의된 brief를 받아 plans → spec → 매우 상세한 impl_plans를 순차 수렴시키고 goal로 인계한다.</desc><style>text{font-family:Geist,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}.mono{font-family:"Geist Mono","Cascadia Code",monospace}</style><defs><marker id="goal-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="goal-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="goal-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="goal-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><text x="80" y="392" font-size="12" text-anchor="start" fill="#4f5d75">작은 작업도 필요한 명세를 짧게 남긴다.</text><text x="80" y="416" font-size="12" text-anchor="start" fill="#4f5d75">plans·spec·impl_plans 동시 착수 금지</text><path data-from="scope" data-to="research" d="M 216 160 L 216 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#goal-arrow-default)"/><path data-from="scope" data-to="blocked" d="M 352 120 L 848 120" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#goal-arrow-default)"/><path data-from="research" data-to="plans" d="M 352 272 L 440 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#goal-arrow-default)"/><path data-from="plans" data-to="spec" d="M 720 272 L 848 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#goal-arrow-default)"/><path data-from="spec" data-to="impl" d="M 984 320 L 984 480 Q 984 488 976 488 L 720 488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#goal-arrow-default)"/><path data-from="impl" data-to="package" d="M 440 488 L 408 488 Q 400 488 400 496 L 400 600 Q 400 608 392 608 L 360 608" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#goal-arrow-default)"/><g class="edge-label"><rect x="542" y="92" width="116" height="20" rx="2" fill="#f5f5f5"/><text x="600" y="108" font-size="12" text-anchor="middle" fill="#4f5d75">필수 증거 미확보</text></g><g class="edge-label"><rect x="754" y="244" width="60" height="20" rx="2" fill="#f5f5f5"/><text x="784" y="260" font-size="12" text-anchor="middle" fill="#4f5d75">수렴 후</text></g><g data-node="scope"><rect x="80" y="80" width="272" height="80" rx="6" fill="#f5f5f5"/><rect x="80" y="80" width="272" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="216.0" y="112" font-size="16" text-anchor="middle" fill="#2d3142">합의된 brief 입력 검사</text><text x="216.0" y="144" font-size="12" text-anchor="middle" fill="#4f5d75">R/AC·사용자 제약 보존</text></g><g data-node="research"><rect x="80" y="224" width="272" height="96" rx="6" fill="#f5f5f5"/><rect x="80" y="224" width="272" height="96" rx="6" fill="#fff" stroke="#2d3142"/><text x="92" y="240" font-size="8" text-anchor="start" fill="#4f5d75" class="mono">RESEARCH</text><text x="216.0" y="260" font-size="16" text-anchor="middle" fill="#2d3142">실제 코드·설정 조사</text><text x="216.0" y="304" font-size="12" text-anchor="middle" fill="#4f5d75">재사용 판정·신규 예외·영향 범위</text></g><g data-node="plans"><rect x="440" y="224" width="280" height="96" rx="6" fill="#f5f5f5"/><rect x="440" y="224" width="280" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="452" y="240" font-size="8" text-anchor="start" fill="#4f5d75" class="mono">GATE 1</text><text x="580.0" y="260" font-size="16" text-anchor="middle" fill="#2d3142">plans 작성 → 수렴</text><text x="580.0" y="304" font-size="12" text-anchor="middle" fill="#4f5d75">범위 계약·검증 매트릭스</text></g><g data-node="spec"><rect x="848" y="224" width="280" height="96" rx="6" fill="#f5f5f5"/><rect x="848" y="224" width="280" height="96" rx="6" fill="#fff" stroke="#2d3142"/><text x="860" y="240" font-size="8" text-anchor="start" fill="#4f5d75" class="mono">GATE 2</text><text x="988.0" y="260" font-size="16" text-anchor="middle" fill="#2d3142">spec 작성 → 수렴</text><text x="988.0" y="304" font-size="12" text-anchor="middle" fill="#4f5d75">정확한 동작·오류·공유 계약</text></g><g data-node="impl"><rect x="440" y="440" width="280" height="96" rx="6" fill="#f5f5f5"/><rect x="440" y="440" width="280" height="96" rx="6" fill="#fff" stroke="#2d3142"/><text x="452" y="456" font-size="8" text-anchor="start" fill="#4f5d75" class="mono">GATE 3</text><text x="580.0" y="476" font-size="16" text-anchor="middle" fill="#2d3142">매우 상세한 impl_plans</text><text x="580.0" y="520" font-size="12" text-anchor="middle" fill="#4f5d75">경로·심볼·명령·기대 결과</text></g><g data-node="package"><rect x="80" y="568" width="280" height="80" rx="6" fill="#f5f5f5"/><rect x="80" y="568" width="280" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="220.0" y="600" font-size="16" text-anchor="middle" fill="#2d3142">goal + pre-work</text><text x="220.0" y="632" font-size="12" text-anchor="middle" fill="#4f5d75">필요 시 backlog 별도 격리</text></g><g data-node="blocked"><rect x="848" y="80" width="280" height="80" rx="6" fill="#f5f5f5"/><rect x="848" y="80" width="280" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="988.0" y="112" font-size="16" text-anchor="middle" fill="#2d3142">미확정 초안 / 증거 대기</text><text x="988.0" y="144" font-size="12" text-anchor="middle" fill="#4f5d75">원인·미확인 사실·재개 조건</text></g><line x1="40" y1="672" x2="1240" y2="672" stroke="#bfc0c0"/><text x="40" y="700" font-size="12" text-anchor="start" fill="#4f5d75">실선: 처리·인계  /  점선: 선택·복귀·응답  /  주황: 핵심 판단 또는 결과</text></svg>
