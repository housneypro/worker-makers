<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clarification-title clarification-desc"><title id="clarification-title">계획 중 질문 · 근거 확인과 사용자 질의 루프</title><desc id="clarification-desc">goal-maker가 계획의 제어권을 유지하고 breif-maker의 질의응답으로 요구 의문을 해소한다.</desc><style>text{font-family:Geist,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}.mono{font-family:"Geist Mono","Cascadia Code",monospace}</style><defs><marker id="clarification-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="clarification-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="clarification-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="clarification-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><text x="400" y="392" font-size="12" text-anchor="start" fill="#4f5d75">근거가 바뀌지 않은 동일 질문은 재호출하지 않는다.</text><text x="400" y="420" font-size="12" text-anchor="start" fill="#4f5d75">질의 결과만 반환한다. 재귀 스킬 호출은 하지 않는다.</text><path data-from="planning" data-to="kind" d="M 640 120 L 640 188" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#clarification-arrow-default)"/><path data-from="kind" data-to="technical" d="M 544 236 L 432 236" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#clarification-arrow-default)"/><path data-from="kind" data-to="brief" d="M 736 236 L 848 236" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#clarification-arrow-default)"/><path data-from="technical" data-to="resume" d="M 296 280 L 296 592 Q 296 600 304 600 L 400 600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#clarification-arrow-default)"/><path data-from="brief" data-to="evidence" d="M 984 280 L 984 368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#clarification-arrow-default)"/><path data-from="evidence" data-to="answer" d="M 1080 416 L 1112 416 Q 1120 416 1120 424 L 1120 560" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#clarification-arrow-default)"/><path data-from="evidence" data-to="user" d="M 984 464 L 984 504 Q 984 512 976 512 L 812 512 Q 804 512 804 520 L 804 560" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#clarification-arrow-default)"/><path data-from="user" data-to="answer" d="M 920 600 L 1008 600" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#clarification-arrow-default)"/><path data-from="answer" data-to="resume" d="M 1120 640 L 1120 648 Q 1120 656 1112 656 L 528 656 Q 520 656 520 648 L 520 640" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#clarification-arrow-default)"/><g class="edge-label"><rect x="468" y="208" width="40" height="20" rx="2" fill="#f5f5f5"/><text x="488" y="224" font-size="12" text-anchor="middle" fill="#4f5d75">기술</text></g><g class="edge-label"><rect x="772" y="208" width="40" height="20" rx="2" fill="#f5f5f5"/><text x="792" y="224" font-size="12" text-anchor="middle" fill="#4f5d75">요구</text></g><g class="edge-label"><rect x="1134" y="488" width="28" height="20" rx="2" fill="#f5f5f5"/><text x="1148" y="504" font-size="12" text-anchor="middle" fill="#4f5d75">예</text></g><g class="edge-label"><rect x="868" y="484" width="52" height="20" rx="2" fill="#f5f5f5"/><text x="894" y="500" font-size="12" text-anchor="middle" fill="#4f5d75">미확정</text></g><g class="edge-label"><rect x="944" y="572" width="40" height="20" rx="2" fill="#f5f5f5"/><text x="964" y="588" font-size="12" text-anchor="middle" fill="#4f5d75">답변</text></g><g data-node="planning"><rect x="504" y="48" width="272" height="72" rx="6" fill="#f5f5f5"/><rect x="504" y="48" width="272" height="72" rx="6" fill="#fff" stroke="#2d3142"/><text x="640.0" y="80" font-size="16" text-anchor="middle" fill="#2d3142">goal-maker 계획 중 질문</text><text x="640.0" y="104" font-size="12" text-anchor="middle" fill="#4f5d75">질문 ID · 단계 · 영향 R/AC/D</text></g><g data-node="kind"><polygon points="640,188 736,236 640,284 544,236" fill="#f5f5f5" stroke="#eb6c36"/><text x="640" y="232" font-size="16" text-anchor="middle" fill="#2d3142">질문 종류?</text><text x="640" y="256" font-size="12" text-anchor="middle" fill="#4f5d75">기술 판단 / 요구 의미</text></g><g data-node="technical"><rect x="160" y="200" width="272" height="80" rx="6" fill="#f5f5f5"/><rect x="160" y="200" width="272" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="296.0" y="232" font-size="16" text-anchor="middle" fill="#2d3142">goal-maker 기술 조사</text><text x="296.0" y="264" font-size="12" text-anchor="middle" fill="#4f5d75">기존 제약 안에서 자율 결정</text></g><g data-node="brief"><rect x="848" y="200" width="272" height="80" rx="6" fill="#f5f5f5"/><rect x="848" y="200" width="272" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="984.0" y="232" font-size="16" text-anchor="middle" fill="#2d3142">breif-maker 질의응답</text><text x="984.0" y="264" font-size="12" text-anchor="middle" fill="#4f5d75">brief · 대화 · 정본 자료 확인</text></g><g data-node="evidence"><polygon points="984,368 1080,416 984,464 888,416" fill="#f5f5f5" stroke="#eb6c36"/><text x="984" y="412" font-size="16" text-anchor="middle" fill="#2d3142">근거로 확정?</text><text x="984" y="436" font-size="12" text-anchor="middle" fill="#4f5d75">새 선호 추정 금지</text></g><g data-node="user"><rect x="688" y="560" width="232" height="80" rx="6" fill="#f5f5f5"/><rect x="688" y="560" width="232" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="804.0" y="592" font-size="16" text-anchor="middle" fill="#2d3142">허브가 사용자 질의</text><text x="804.0" y="624" font-size="12" text-anchor="middle" fill="#4f5d75">답변 전 의존 계획 대기</text></g><g data-node="answer"><rect x="1008" y="560" width="232" height="80" rx="6" fill="#f5f5f5"/><rect x="1008" y="560" width="232" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="1124.0" y="592" font-size="16" text-anchor="middle" fill="#2d3142">답·근거·영향 기록</text><text x="1124.0" y="624" font-size="12" text-anchor="middle" fill="#4f5d75">필요 시 brief 새 revision</text></g><g data-node="resume"><rect x="400" y="560" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="400" y="560" width="240" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="520.0" y="592" font-size="16" text-anchor="middle" fill="#2d3142">영향 계획만 재수렴</text><text x="520.0" y="624" font-size="12" text-anchor="middle" fill="#4f5d75">같은 패키지·체크포인트 재개</text></g><line x1="40" y1="672" x2="1240" y2="672" stroke="#bfc0c0"/><text x="40" y="700" font-size="12" text-anchor="start" fill="#4f5d75">실선: 처리·인계  /  점선: 선택·복귀·응답  /  주황: 핵심 판단 또는 결과</text></svg>
