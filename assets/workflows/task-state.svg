<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="task-state-title task-state-desc"><title id="task-state-title">태스크 상태 · 준비·실행·보고·통합 구분</title><desc id="task-state-desc">준비 intent와 실제 worker 실행을 구분하고 검사된 결과를 통합한다.</desc><style>text{font-family:Geist,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}.mono{font-family:"Geist Mono","Cascadia Code",monospace}</style><defs><marker id="task-state-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="task-state-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="task-state-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="task-state-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><text x="64" y="660" font-size="12" text-anchor="start" fill="#4f5d75">ready는 실행 가능 판정이다. 중지·취소는 run 상태로 관리한다.</text><path data-from="queued" data-to="ready" d="M 304 124 L 400 124" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#task-state-arrow-default)"/><path data-from="ready" data-to="preparing" d="M 640 124 L 784 124" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#task-state-arrow-default)"/><path data-from="preparing" data-to="prepared" d="M 904 168 L 904 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#task-state-arrow-default)"/><path data-from="prepared" data-to="running" d="M 784 324 L 640 324" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#task-state-arrow-default)"/><path data-from="running" data-to="reported" d="M 400 324 L 304 324" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#task-state-arrow-default)"/><path data-from="reported" data-to="merged" d="M 184 368 L 184 504" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#task-state-arrow-default)"/><path data-from="running" data-to="failed" d="M 640 344 L 704 344 Q 712 344 712 352 L 712 540 Q 712 548 720 548 L 784 548" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#task-state-arrow-default)"/><path data-from="failed" data-to="queued" d="M 904 592 L 904 624 Q 904 632 896 632 L 48 632 Q 40 632 40 624 L 40 132 Q 40 124 48 124 L 64 124" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#task-state-arrow-default)"/><path data-from="reported" data-to="blocked" d="M 304 344 L 344 344 Q 352 344 352 352 L 352 448 Q 352 456 360 456 L 512 456 Q 520 456 520 464 L 520 504" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#task-state-arrow-default)"/><path data-from="blocked" data-to="reported" d="M 400 528 L 336 528 Q 328 528 328 520 L 328 368 Q 328 360 320 360 L 304 360" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#task-state-arrow-default)"/><path data-from="blocked" data-to="merged" d="M 400 568 L 360 568 Q 352 568 352 560 L 352 556 Q 352 548 344 548 L 304 548" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#task-state-arrow-default)"/><g class="edge-label"><rect x="316" y="96" width="72" height="20" rx="2" fill="#f5f5f5"/><text x="352" y="112" font-size="12" text-anchor="middle" fill="#4f5d75">조건 충족</text></g><g class="edge-label"><rect x="678" y="96" width="68" height="20" rx="2" fill="#f5f5f5"/><text x="712" y="112" font-size="12" text-anchor="middle" fill="#4f5d75">prepare</text></g><g class="edge-label"><rect x="914" y="216" width="104" height="20" rx="2" fill="#f5f5f5"/><text x="966" y="232" font-size="12" text-anchor="middle" fill="#4f5d75">사본·기록 확정</text></g><g class="edge-label"><rect x="658" y="296" width="108" height="20" rx="2" fill="#f5f5f5"/><text x="712" y="312" font-size="12" text-anchor="middle" fill="#4f5d75">기동·dispatch</text></g><g class="edge-label"><rect x="322" y="296" width="60" height="20" rx="2" fill="#f5f5f5"/><text x="352" y="312" font-size="12" text-anchor="middle" fill="#4f5d75">report</text></g><g class="edge-label"><rect x="194" y="432" width="52" height="20" rx="2" fill="#f5f5f5"/><text x="220" y="448" font-size="12" text-anchor="middle" fill="#4f5d75">merge</text></g><g class="edge-label"><rect x="724" y="520" width="48" height="20" rx="2" fill="#f5f5f5"/><text x="748" y="536" font-size="12" text-anchor="middle" fill="#4f5d75">fail</text></g><g class="edge-label"><rect x="528" y="604" width="144" height="20" rx="2" fill="#f5f5f5"/><text x="600" y="620" font-size="12" text-anchor="middle" fill="#4f5d75">retry · 새 attempt</text></g><g class="edge-label"><rect x="404" y="428" width="72" height="20" rx="2" fill="#f5f5f5"/><text x="440" y="444" font-size="12" text-anchor="middle" fill="#4f5d75">통합 충돌</text></g><g class="edge-label"><rect x="338" y="472" width="52" height="20" rx="2" fill="#f5f5f5"/><text x="364" y="488" font-size="12" text-anchor="middle" fill="#4f5d75">재시도</text></g><g class="edge-label"><rect x="332" y="520" width="40" height="20" rx="2" fill="#f5f5f5"/><text x="352" y="536" font-size="12" text-anchor="middle" fill="#4f5d75">수용</text></g><g data-node="queued"><rect x="64" y="80" width="240" height="88" rx="6" fill="#f5f5f5"/><rect x="64" y="80" width="240" height="88" rx="6" fill="#fff" stroke="#2d3142"/><text x="184.0" y="112" font-size="16" text-anchor="middle" fill="#2d3142">queued</text><text x="184.0" y="152" font-size="12" text-anchor="middle" fill="#4f5d75">계획된 task 등록</text></g><g data-node="ready"><rect x="400" y="80" width="240" height="88" rx="6" fill="#f5f5f5"/><rect x="400" y="80" width="240" height="88" rx="6" fill="#fff" stroke="#2d3142"/><text x="520.0" y="112" font-size="16" text-anchor="middle" fill="#2d3142">ready</text><text x="520.0" y="152" font-size="12" text-anchor="middle" fill="#4f5d75">deps · phase gate 충족</text></g><g data-node="preparing"><rect x="784" y="80" width="240" height="88" rx="6" fill="#f5f5f5"/><rect x="784" y="80" width="240" height="88" rx="6" fill="#fff" stroke="#2d3142"/><text x="904.0" y="112" font-size="16" text-anchor="middle" fill="#2d3142">preparing</text><text x="904.0" y="152" font-size="12" text-anchor="middle" fill="#4f5d75">준비 intent · 같은 attempt 재개</text></g><g data-node="prepared"><rect x="784" y="280" width="240" height="88" rx="6" fill="#f5f5f5"/><rect x="784" y="280" width="240" height="88" rx="6" fill="#fff" stroke="#2d3142"/><text x="904.0" y="312" font-size="16" text-anchor="middle" fill="#2d3142">prepared</text><text x="904.0" y="352" font-size="12" text-anchor="middle" fill="#4f5d75">packet · 격리 준비 완료</text></g><g data-node="running"><rect x="400" y="280" width="240" height="88" rx="6" fill="#f5f5f5"/><rect x="400" y="280" width="240" height="88" rx="6" fill="#fff" stroke="#2d3142"/><text x="520.0" y="312" font-size="16" text-anchor="middle" fill="#2d3142">running</text><text x="520.0" y="352" font-size="12" text-anchor="middle" fill="#4f5d75">선택 모델 worker 실행</text></g><g data-node="reported"><rect x="64" y="280" width="240" height="88" rx="6" fill="#f5f5f5"/><rect x="64" y="280" width="240" height="88" rx="6" fill="#fff" stroke="#2d3142"/><text x="184.0" y="312" font-size="16" text-anchor="middle" fill="#2d3142">reported</text><text x="184.0" y="352" font-size="12" text-anchor="middle" fill="#4f5d75">종료 · 실제 결과 검사 완료</text></g><g data-node="merged"><rect x="64" y="504" width="240" height="88" rx="6" fill="#f5f5f5"/><rect x="64" y="504" width="240" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="184.0" y="536" font-size="16" text-anchor="middle" fill="#2d3142">merged</text><text x="184.0" y="576" font-size="12" text-anchor="middle" fill="#4f5d75">직렬 통합 완료</text></g><g data-node="blocked"><rect x="400" y="504" width="240" height="88" rx="6" fill="#f5f5f5"/><rect x="400" y="504" width="240" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="520.0" y="536" font-size="16" text-anchor="middle" fill="#2d3142">blocked</text><text x="520.0" y="576" font-size="12" text-anchor="middle" fill="#4f5d75">통합 충돌 · 조정 대기</text></g><g data-node="failed"><rect x="784" y="504" width="240" height="88" rx="6" fill="#f5f5f5"/><rect x="784" y="504" width="240" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="904.0" y="536" font-size="16" text-anchor="middle" fill="#2d3142">failed</text><text x="904.0" y="576" font-size="12" text-anchor="middle" fill="#4f5d75">실패 증거 · 재시도 판단</text></g><line x1="40" y1="672" x2="1240" y2="672" stroke="#bfc0c0"/><text x="40" y="700" font-size="12" text-anchor="start" fill="#4f5d75">실선: 처리·인계  /  점선: 선택·복귀·응답  /  주황: 핵심 판단 또는 결과</text></svg>
