<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-title overview-desc"><title id="overview-title">요구 정제 · 상세 계획 · 개발 실행의 책임 분리</title><desc id="overview-desc">breif-maker는 요구, goal-maker는 기술 계획, work는 합의된 goal 실행을 소유한다.</desc><style>text{font-family:Geist,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}.mono{font-family:"Geist Mono","Cascadia Code",monospace}</style><defs><marker id="overview-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="overview-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="overview-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="overview-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><text x="64" y="64" font-size="12" text-anchor="start" fill="#4f5d75">breif-maker → brief.md → goal-maker → goal.md → work</text><text x="80" y="392" font-size="12" text-anchor="start" fill="#4f5d75">계획을 work에서 다시 설계하지 않는다.</text><text x="80" y="420" font-size="12" text-anchor="start" fill="#4f5d75">요구 공백 → breif-maker / 계획 결함 → goal-maker</text><path data-from="brief" data-to="goal" d="M 296 160 L 376 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow-default)"/><path data-from="goal" data-to="package" d="M 608 160 L 688 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow-default)"/><path data-from="package" data-to="work" d="M 920 160 L 984 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow-default)"/><path data-from="work" data-to="serial" d="M 1048 208 L 1048 264 Q 1048 272 1040 272 L 880 272 Q 872 272 872 280 L 872 344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow-default)"/><path data-from="work" data-to="parallel" d="M 1144 208 L 1144 296 Q 1144 304 1136 304 L 1120 304 Q 1112 304 1112 312 L 1112 344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow-default)"/><path data-from="serial" data-to="quality" d="M 872 440 L 872 504 Q 872 512 864 512 L 568 512 Q 560 512 560 520 L 560 552" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow-default)"/><path data-from="parallel" data-to="quality" d="M 1112 440 L 1112 584 Q 1112 592 1104 592 L 680 592" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow-default)"/><path data-from="quality" data-to="report" d="M 440 592 L 320 592" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow-default)"/><g data-node="brief"><rect x="64" y="112" width="232" height="96" rx="6" fill="#f5f5f5"/><rect x="64" y="112" width="232" height="96" rx="6" fill="#fff" stroke="#2d3142"/><text x="76" y="128" font-size="8" text-anchor="start" fill="#4f5d75" class="mono">REQUIREMENTS</text><text x="180.0" y="148" font-size="16" text-anchor="middle" fill="#2d3142">breif-maker</text><text x="180.0" y="192" font-size="12" text-anchor="middle" fill="#4f5d75">흩어진 요구·수용 기준 합의</text></g><g data-node="goal"><rect x="376" y="112" width="232" height="96" rx="6" fill="#f5f5f5"/><rect x="376" y="112" width="232" height="96" rx="6" fill="#fff" stroke="#2d3142"/><text x="388" y="128" font-size="8" text-anchor="start" fill="#4f5d75" class="mono">PLANNING</text><text x="492.0" y="148" font-size="16" text-anchor="middle" fill="#2d3142">goal-maker</text><text x="492.0" y="192" font-size="12" text-anchor="middle" fill="#4f5d75">plans · spec · 상세 impl_plans</text></g><g data-node="package"><rect x="688" y="112" width="232" height="96" rx="6" fill="#f5f5f5"/><rect x="688" y="112" width="232" height="96" rx="6" fill="#fff" stroke="#2d3142"/><text x="700" y="128" font-size="8" text-anchor="start" fill="#4f5d75" class="mono">FROZEN</text><text x="804.0" y="148" font-size="16" text-anchor="middle" fill="#2d3142">합의된 goal.md</text><text x="804.0" y="192" font-size="12" text-anchor="middle" fill="#4f5d75">task · owns · deps · 검증</text></g><g data-node="work"><rect x="984" y="112" width="232" height="96" rx="6" fill="#f5f5f5"/><rect x="984" y="112" width="232" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="996" y="128" font-size="8" text-anchor="start" fill="#4f5d75" class="mono">EXECUTION</text><text x="1100.0" y="148" font-size="16" text-anchor="middle" fill="#2d3142">work · 단일 허브</text><text x="1100.0" y="192" font-size="12" text-anchor="middle" fill="#4f5d75">worker 모델·실행 배치</text></g><g data-node="serial"><rect x="760" y="344" width="224" height="96" rx="6" fill="#f5f5f5"/><rect x="760" y="344" width="224" height="96" rx="6" fill="#fff" stroke="#2d3142"/><text x="772" y="360" font-size="8" text-anchor="start" fill="#4f5d75" class="mono">SERIAL</text><text x="872.0" y="380" font-size="16" text-anchor="middle" fill="#2d3142">개발 worker · 순차</text><text x="872.0" y="424" font-size="12" text-anchor="middle" fill="#4f5d75">선택 모델 · 동시성 1</text></g><g data-node="parallel"><rect x="1008" y="344" width="208" height="96" rx="6" fill="#f5f5f5"/><rect x="1008" y="344" width="208" height="96" rx="6" fill="#fff" stroke="#2d3142"/><text x="1020" y="360" font-size="8" text-anchor="start" fill="#4f5d75" class="mono">PARALLEL</text><text x="1112.0" y="380" font-size="16" text-anchor="middle" fill="#2d3142">work-parallel</text><text x="1112.0" y="424" font-size="12" text-anchor="middle" fill="#4f5d75">선택 모델 · 독립 작업</text></g><g data-node="quality"><rect x="440" y="552" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="440" y="552" width="240" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="560.0" y="584" font-size="16" text-anchor="middle" fill="#2d3142">허브 · 리뷰·검증</text><text x="560.0" y="616" font-size="12" text-anchor="middle" fill="#4f5d75">독립 리뷰는 별도 모델 정책</text></g><g data-node="report"><rect x="80" y="552" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="80" y="552" width="240" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="200.0" y="584" font-size="16" text-anchor="middle" fill="#2d3142">전체 완료 보고</text><text x="200.0" y="616" font-size="12" text-anchor="middle" fill="#4f5d75">실제 증거·모든 phase 확인</text></g><line x1="40" y1="672" x2="1240" y2="672" stroke="#bfc0c0"/><text x="40" y="700" font-size="12" text-anchor="start" fill="#4f5d75">실선: 처리·인계  /  점선: 선택·복귀·응답  /  주황: 핵심 판단 또는 결과</text></svg>
