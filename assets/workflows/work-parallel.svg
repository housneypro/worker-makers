<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="parallel-title parallel-desc"><title id="parallel-title">work-parallel · 병렬 실행, 직렬 통합</title><desc id="parallel-desc">deps가 통합되고 phase 검증 배리어가 충족된 작업만 기동하며, 결과는 하나의 통합 큐로 회수한다.</desc><style>text{font-family:Geist,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}.mono{font-family:"Geist Mono","Cascadia Code",monospace}</style><defs><marker id="parallel-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="parallel-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="parallel-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="parallel-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><text x="80" y="564" font-size="12" text-anchor="start" fill="#4f5d75">원격 발행·실 DB/API 변경·전체 빌드는 작업자에게 분산시키지 않는다.</text><text x="80" y="592" font-size="12" text-anchor="start" fill="#4f5d75">실패·질문·용량 부족은 work가 처리한다. 병렬 배치가 새 허브나 별도 목표를 만들지 않는다.</text><path data-from="input" data-to="ready" d="M 304 120 L 408 120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#parallel-arrow-default)"/><path data-from="ready" data-to="a" d="M 648 96 L 792 96 Q 800 96 800 104 L 800 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#parallel-arrow-default)"/><path data-from="ready" data-to="b" d="M 648 128 L 1096 128 Q 1104 128 1104 136 L 1104 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#parallel-arrow-default)"/><path data-from="a" data-to="receipt" d="M 864 304 L 864 336 Q 864 344 872 344 L 920 344 Q 928 344 928 352 L 928 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#parallel-arrow-default)"/><path data-from="b" data-to="receipt" d="M 1104 304 L 1104 352 Q 1104 360 1096 360 L 1032 360 Q 1024 360 1024 368 L 1024 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#parallel-arrow-default)"/><path data-from="receipt" data-to="merge" d="M 856 440 L 680 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#parallel-arrow-default)"/><path data-from="merge" data-to="return" d="M 440 440 L 320 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#parallel-arrow-default)"/><path data-from="merge" data-to="ready" d="M 560 400 L 560 160" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#parallel-arrow-default)"/><g class="edge-label"><rect x="568" y="268" width="104" height="20" rx="2" fill="#f5f5f5"/><text x="620" y="284" font-size="12" text-anchor="middle" fill="#4f5d75">후행 작업 준비</text></g><g data-node="input"><rect x="64" y="80" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="64" y="80" width="240" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="184.0" y="112" font-size="16" text-anchor="middle" fill="#2d3142">work의 배치 지시</text><text x="184.0" y="144" font-size="12" text-anchor="middle" fill="#4f5d75">run · batch · 계약 · worker 모델</text></g><g data-node="ready"><rect x="408" y="80" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="408" y="80" width="240" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="528.0" y="112" font-size="16" text-anchor="middle" fill="#2d3142">ready DAG 스케줄러</text><text x="528.0" y="144" font-size="12" text-anchor="middle" fill="#4f5d75">동시성 상한·자원 잠금</text></g><g data-node="a"><rect x="760" y="224" width="200" height="80" rx="6" fill="#f5f5f5"/><rect x="760" y="224" width="200" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="860.0" y="256" font-size="16" text-anchor="middle" fill="#2d3142">구현자 A</text><text x="860.0" y="288" font-size="12" text-anchor="middle" fill="#4f5d75">선택 모델 / owns A</text></g><g data-node="b"><rect x="1008" y="224" width="200" height="80" rx="6" fill="#f5f5f5"/><rect x="1008" y="224" width="200" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="1108.0" y="256" font-size="16" text-anchor="middle" fill="#2d3142">구현자 B</text><text x="1108.0" y="288" font-size="12" text-anchor="middle" fill="#4f5d75">선택 모델 / owns B</text></g><g data-node="receipt"><rect x="856" y="400" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="856" y="400" width="240" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="976.0" y="432" font-size="16" text-anchor="middle" fill="#2d3142">결과 회수 검사</text><text x="976.0" y="464" font-size="12" text-anchor="middle" fill="#4f5d75">attempt · diff · 지문</text></g><g data-node="merge"><rect x="440" y="400" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="440" y="400" width="240" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="560.0" y="432" font-size="16" text-anchor="middle" fill="#2d3142">통합 큐 · 한 건씩</text><text x="560.0" y="464" font-size="12" text-anchor="middle" fill="#4f5d75">저장소별 직렬 merge</text></g><g data-node="return"><rect x="80" y="400" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="80" y="400" width="240" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="200.0" y="432" font-size="16" text-anchor="middle" fill="#2d3142">work로 배치 반환</text><text x="200.0" y="464" font-size="12" text-anchor="middle" fill="#4f5d75">리뷰·검증은 상위 허브</text></g><line x1="40" y1="672" x2="1240" y2="672" stroke="#bfc0c0"/><text x="40" y="700" font-size="12" text-anchor="start" fill="#4f5d75">실선: 처리·인계  /  점선: 선택·복귀·응답  /  주황: 핵심 판단 또는 결과</text></svg>
