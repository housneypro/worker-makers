<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="contract-title contract-desc"><title id="contract-title">계약 의존 레인 · 병렬화의 한계</title><desc id="contract-desc">공유 계약이 고정돼야 독립 구현이 가능하고, 실제 계약 수용 전에는 소비자 통합을 시작하지 않는다.</desc><style>text{font-family:Geist,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}.mono{font-family:"Geist Mono","Cascadia Code",monospace}</style><defs><marker id="contract-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="contract-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="contract-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="contract-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><line x1="40" y1="40" x2="1240" y2="40" stroke="#bfc0c0"/><text x="48" y="64" font-size="12" text-anchor="start" fill="#4f5d75">허브 · 공유 계약</text><line x1="40" y1="216" x2="1240" y2="216" stroke="#bfc0c0"/><text x="48" y="240" font-size="12" text-anchor="start" fill="#4f5d75">제공자 · 예: BE</text><line x1="40" y1="392" x2="1240" y2="392" stroke="#bfc0c0"/><text x="48" y="416" font-size="12" text-anchor="start" fill="#4f5d75">소비자 · 예: FE</text><text x="64" y="584" font-size="12" text-anchor="start" fill="#4f5d75">rejected → 제공자 수정/계약 재수렴 → accepted 재검사. 소비자 통합은 그동안 대기한다.</text><path data-from="frozen" data-to="backend" d="M 296 128 L 488 128 Q 496 128 496 136 L 496 256" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#contract-arrow-default)"/><path data-from="frozen" data-to="scaffold" d="M 180 184 L 180 464 Q 180 472 188 472 L 376 472" 