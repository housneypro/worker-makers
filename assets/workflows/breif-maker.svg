<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="brainstorm-title brainstorm-desc"><title id="brainstorm-title">breif-maker · 흩어진 요구를 실행 가능한 입력으로</title><desc id="brainstorm-desc">목적·제품 동작·범위·수용 기준을 합의하고 brief로 인계한다. 기술 설계는 goal-maker가 맡는다.</desc><style>text{font-family:Geist,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}.mono{font-family:"Geist Mono","Cascadia Code",monospace}</style><defs><marker id="brainstorm-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="brainstorm-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="brainstorm-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="brainstorm-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><text x="80" y="616" font-size="12" text-anchor="start" fill="#4f5d75">인계 기준  요구 미결정 해소 + R/AC 연결 + 기술적 미확정과 제약 전달 / 제품 구현·상세 명세 작성 없음</text><path data-from="context" data-to="intent" d="M 220 168 L 220 240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#brainstorm-arrow-default)"/><path data-from="context" data-to="reuse" d="M 360 124 L 480 124" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#brainstorm-arrow-default)"/><path data-from="intent" data-to="approach" d="M 360 284 L 480 284" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#brainstorm-arrow-default)"/><path data-from="approach" data-to="brief" d="M 760 284 L 880 284" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#brainstorm-arrow-default)"/><path data-from="reuse" data-to="brief" d="M 760 124 L 792 124 Q 800 124 800 132 L 800 184 Q 800 192 808 192 L 1012 192 Q 1020 192 1020 200 L 1020 240" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#brainstorm-arrow-default)"/><path data-from="brief" data-to="agreed" d="M 1020 328 L 1020 408" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#brainstorm-arrow-default)"/><path data-from="agreed" data-to="plans" d="M 1020 504 L 1020 568" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#brainstorm-arrow-default)"/><path data-from="agreed" data-to="approach" d="M 924 456 L 628 456 Q 620 456 620 448 L 620 328" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#brainstorm-arrow-default)"/><path data-from="intent" data-to="probe" d="M 220 328 L 220 432" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#brainstorm-arrow-default)"/><g class="edge-label"><rect x="244" y="192" width="72" height="20" rx="2" fill="#f5f5f5"/><text x="280" y="208" font-size="12" text-anchor="middle" fill="#4f5d75">의도 부족</text></g><g class="edge-label"><rect x="384" y="96" width="72" height="20" rx="2" fill="#f5f5f5"/><text x="420" y="112" font-size="12" text-anchor="middle" fill="#4f5d75">합의 충분</text></g><g class="edge-label"><rect x="394" y="256" width="52" height="20" rx="2" fill="#f5f5f5"/><text x="420" y="272" font-size="12" text-anchor="middle" fill="#4f5d75">계획화</text></g><g class="edge-label"><rect x="1046" y="524" width="28" height="20" rx="2" fill="#f5f5f5"/><text x="1060" y="540" font-size="12" text-anchor="middle" fill="#4f5d75">예</text></g><g class="edge-label"><rect x="696" y="428" width="160" height="20" rx="2" fill="#f5f5f5"/><text x="776" y="444" font-size="12" text-anchor="middle" fill="#4f5d75">아니오 · 영향 결정 개정</text></g><g class="edge-label"><rect x="268" y="368" width="104" height="20" rx="2" fill="#f5f5f5"/><text x="320" y="384" font-size="12" text-anchor="middle" fill="#4f5d75">탐색 전용 요청</text></g><g data-node="context"><rect x="80" y="80" width="280" height="88" rx="6" fill="#f5f5f5"/><rect x="80" y="80" width="280" height="88" rx="6" fill="#fff" stroke="#2d3142"/><text x="220.0" y="112" font-size="16" text-anchor="middle" fill="#2d3142">맥락·미결정 분류</text><text x="220.0" y="152" font-size="12" text-anchor="middle" fill="#4f5d75">사용자 선택 / 조사 / 기술 선택</text></g><g data-node="reuse"><rect x="480" y="80" width="280" height="88" rx="6" fill="#f5f5f5"/><rect x="480" y="80" width="280" height="88" rx="6" fill="#fff" stroke="#2d3142"/><text x="620.0" y="112" font-size="16" text-anchor="middle" fill="#2d3142">기존 합의 재사용</text><text x="620.0" y="152" font-size="12" text-anchor="middle" fill="#4f5d75">새 질문·재승인 강요 없음</text></g><g data-node="intent"><rect x="80" y="240" width="280" height="88" rx="6" fill="#f5f5f5"/><rect x="80" y="240" width="280" height="88" rx="6" fill="#fff" stroke="#2d3142"/><text x="220.0" y="272" font-size="16" text-anchor="middle" fill="#2d3142">영향·위험별 의도 탐색</text><text x="220.0" y="312" font-size="12" text-anchor="middle" fill="#4f5d75">답이 바꿀 결정부터 질문</text></g><g data-node="approach"><rect x="480" y="240" width="280" height="88" rx="6" fill="#f5f5f5"/><rect x="480" y="240" width="280" height="88" rx="6" fill="#fff" stroke="#2d3142"/><text x="620.0" y="272" font-size="16" text-anchor="middle" fill="#2d3142">제품 방향·범위 비교</text><text x="620.0" y="312" font-size="12" text-anchor="middle" fill="#4f5d75">시나리오·우선순위·제약</text></g><g data-node="brief"><rect x="880" y="240" width="280" height="88" rx="6" fill="#f5f5f5"/><rect x="880" y="240" width="280" height="88" rx="6" fill="#fff" stroke="#2d3142"/><text x="1020.0" y="272" font-size="16" text-anchor="middle" fill="#2d3142">brief · 요구와 수용 기준</text><text x="1020.0" y="312" font-size="12" text-anchor="middle" fill="#4f5d75">R → AC · 합의 근거</text></g><g data-node="agreed"><polygon points="1020,408 1116,456 1020,504 924,456" fill="#f5f5f5" stroke="#eb6c36"/><text x="1020" y="452" font-size="16" text-anchor="middle" fill="#2d3142">요구 정제 완료?</text><text x="1020" y="476" font-size="12" text-anchor="middle" fill="#4f5d75">선택 해소 · 기준 연결</text></g><g data-node="plans"><rect x="880" y="568" width="280" height="80" rx="6" fill="#f5f5f5"/><rect x="880" y="568" width="280" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="1020.0" y="600" font-size="16" text-anchor="middle" fill="#2d3142">brief 인계 → goal-maker</text><text x="1020.0" y="632" font-size="12" text-anchor="middle" fill="#4f5d75">기술 계획은 다음 단계가 소유</text></g><g data-node="probe"><rect x="80" y="432" width="280" height="88" rx="6" fill="#f5f5f5"/><rect x="80" y="432" width="280" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="220.0" y="464" font-size="16" text-anchor="middle" fill="#2d3142">탐색 결과로 종료</text><text x="220.0" y="504" font-size="12" text-anchor="middle" fill="#4f5d75">타당성·증거·한계·권고</text></g><line x1="40" y1="672" x2="1240" y2="672" stroke="#bfc0c0"/><text x="40" y="700" font-size="12" text-anchor="start" fill="#4f5d75">실선: 처리·인계  /  점선: 선택·복귀·응답  /  주황: 핵심 판단 또는 결과</text></svg>
