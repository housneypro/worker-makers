<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workspace-title workspace-desc"><title id="workspace-title">프로젝트 설치 · 작업별 공간 · 코드 worktree</title><desc id="workspace-desc">설치 스킬과 작업 산출물을 분리하고, 모든 worker는 확정한 프로젝트와 작업 root를 공유한다.</desc><style>text{font-family:Geist,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}.mono{font-family:"Geist Mono","Cascadia Code",monospace}</style><defs><marker id="workspace-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="workspace-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="workspace-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="workspace-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><text x="64" y="408" font-size="12" text-anchor="start" fill="#4f5d75">CWD나 도구 clone의 .git에서 제품 root를 다시 추론하지 않는다.</text><path data-from="project" data-to="skills" d="M 480 104 L 168 104 Q 160 104 160 112 L 160 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workspace-arrow-default)"/><path data-from="project" data-to="workspace" d="M 640 144 L 640 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workspace-arrow-default)"/><path data-from="project" data-to="source" d="M 800 104 L 1072 104 Q 1080 104 1080 112 L 1080 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workspace-arrow-default)"/><path data-from="workspace" data-to="job" d="M 640 344 L 640 416" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workspace-arrow-default)"/><path data-from="job" data-to="artifacts" d="M 480 456 L 408 456 Q 400 456 400 464 L 400 520 Q 400 528 392 528 L 344 528" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workspace-arrow-default)"/><path data-from="job" data-to="task" d="M 800 448 L 1072 448 Q 1080 448 1080 456 L 1080 480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workspace-arrow-default)"/><path data-from="job" data-to="state" d="M 640 496 L 640 568" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workspace-arrow-default)"/><path data-from="job" data-to="integration" d="M 800 480 L 840 480 Q 848 480 848 488 L 848 616 Q 848 624 856 624 L 944 624" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workspace-arrow-default)"/><g data-node="project"><rect x="480" y="64" width="320" height="80" rx="6" fill="#f5f5f5"/><rect x="480" y="64" width="320" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="640.0" y="96" font-size="16" text-anchor="middle" fill="#2d3142">대상 프로젝트 PROJECT_ROOT</text><text x="640.0" y="128" font-size="12" text-anchor="middle" fill="#4f5d75">호출 시 확정 · 제품 저장소 식별</text></g><g data-node="skills"><rect x="64" y="248" width="280" height="96" rx="6" fill="#f5f5f5"/><rect x="64" y="248" width="280" height="96" rx="6" fill="#fff" stroke="#2d3142"/><text x="76" y="264" font-size="8" text-anchor="start" fill="#4f5d75" class="mono">PROJECT SCOPE</text><text x="204.0" y="284" font-size="16" text-anchor="middle" fill="#2d3142">프로젝트 플러그인 등록</text><text x="204.0" y="328" font-size="12" text-anchor="middle" fill="#4f5d75">marketplace + .codex/config.toml</text></g><g data-node="workspace"><rect x="480" y="248" width="320" height="96" rx="6" fill="#f5f5f5"/><rect x="480" y="248" width="320" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="492" y="264" font-size="8" text-anchor="start" fill="#4f5d75" class="mono">WORKSPACE</text><text x="640.0" y="284" font-size="16" text-anchor="middle" fill="#2d3142">.worker-makers/</text><text x="640.0" y="328" font-size="12" text-anchor="middle" fill="#4f5d75">project.json · 공유 프로젝트 연결</text></g><g data-node="source"><rect x="944" y="248" width="272" height="96" rx="6" fill="#f5f5f5"/><rect x="944" y="248" width="272" height="96" rx="6" fill="#fff" stroke="#2d3142"/><text x="956" y="264" font-size="8" text-anchor="start" fill="#4f5d75" class="mono">PLUGIN ASSETS</text><text x="1080.0" y="284" font-size="16" text-anchor="middle" fill="#2d3142">로컬 플러그인 패키지</text><text x="1080.0" y="328" font-size="12" text-anchor="middle" fill="#4f5d75">worker-makers/ · 공통 skills/</text></g><g data-node="job"><rect x="480" y="416" width="320" height="80" rx="6" fill="#f5f5f5"/><rect x="480" y="416" width="320" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="640.0" y="448" font-size="16" text-anchor="middle" fill="#2d3142">작업명별 WORK_ROOT</text><text x="640.0" y="480" font-size="12" text-anchor="middle" fill="#4f5d75">같은 작업의 brief · 계획 · task · 상태</text></g><g data-node="artifacts"><rect x="64" y="480" width="280" height="96" rx="6" fill="#f5f5f5"/><rect x="64" y="480" width="280" height="96" rx="6" fill="#fff" stroke="#2d3142"/><text x="76" y="496" font-size="8" text-anchor="start" fill="#4f5d75" class="mono">DOCUMENTS</text><text x="204.0" y="516" font-size="16" text-anchor="middle" fill="#2d3142">요구·계획 산출물</text><text x="204.0" y="560" font-size="12" text-anchor="middle" fill="#4f5d75">brief · plans · spec · impl_plans</text></g><g data-node="task"><rect x="944" y="480" width="272" height="96" rx="6" fill="#f5f5f5"/><rect x="944" y="480" width="272" height="96" rx="6" fill="#fff" stroke="#2d3142"/><text x="956" y="496" font-size="8" text-anchor="start" fill="#4f5d75" class="mono">WORKER</text><text x="1080.0" y="516" font-size="16" text-anchor="middle" fill="#2d3142">태스크별 코드 worktree</text><text x="1080.0" y="560" font-size="12" text-anchor="middle" fill="#4f5d75">task/T-001/worktree</text></g><g data-node="state"><rect x="480" y="568" width="320" height="72" rx="6" fill="#f5f5f5"/><rect x="480" y="568" width="320" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="640.0" y="600" font-size="16" text-anchor="middle" fill="#2d3142">작업별 실행 원장</text><text x="640.0" y="624" font-size="12" text-anchor="middle" fill="#4f5d75">state.json · events.jsonl · evidence</text></g><g data-node="integration"><rect x="944" y="592" width="272" height="64" rx="6" fill="#f5f5f5"/><rect x="944" y="592" width="272" height="64" rx="6" fill="#fff" stroke="#2d3142"/><text x="1080.0" y="624" font-size="16" text-anchor="middle" fill="#2d3142">허브 통합 worktree</text><text x="1080.0" y="640" font-size="12" text-anchor="middle" fill="#4f5d75">_integration/</text></g><line x1="40" y1="672" x2="1240" y2="672" stroke="#bfc0c0"/><text x="40" y="700" font-size="12" text-anchor="start" fill="#4f5d75">실선: 처리·인계  /  점선: 선택·복귀·응답  /  주황: 핵심 판단 또는 결과</text></svg>
