<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="convergence-title convergence-desc"><title id="convergence-title">goal-maker · 관점별 리뷰와 수렴 루프</title><desc id="convergence-desc">정합성·최소성·완결성·구현가능성·교차정합을 적용 범위에 맞춰 독립 검토한다.</desc><style>text{font-family:Geist,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}.mono{font-family:"Geist Mono","Cascadia Code",monospace}</style><defs><marker id="convergence-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="convergence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="convergence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="convergence-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><text x="80" y="600" font-size="12" text-anchor="start" fill="#4f5d75">보안 CRITICAL/HIGH 확장은 범위 개정을 기록해 반영한다. 실제 실행 권한은 별도로 승계·확인한다.</text><path data-from="artifact" data-to="review" d="M 640 136 L 640 188" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#convergence-arrow-default)"/><path data-from="review" data-to="triage" d="M 640 268 L 640 324" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#convergence-arrow-default)"/><path data-from="triage" data-to="gate" d="M 640 396 L 640 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#convergence-arrow-default)"/><path data-from="triage" data-to="backlog" d="M 792 360 L 944 360" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#convergence-arrow-default)"/><path data-from="gate" data-to="next" d="M 728 488 L 944 488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#convergence-arrow-default)"/><path data-from="gate" data-to="fix" d="M 552 488 L 416 488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#convergence-arrow-default)"/><path data-from="fix" data-to="review" d="M 288 448 L 288 236 Q 288 228 296 228 L 488 228" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#convergence-arrow-default)"/><g class="edge-label"><rect x="832" y="332" width="72" height="20" rx="2" fill="#f5f5f5"/><text x="868" y="348" font-size="12" text-anchor="middle" fill="#4f5d75">확장 제안</text></g><g class="edge-label"><rect x="822" y="460" width="28" height="20" rx="2" fill="#f5f5f5"/><text x="836" y="476" font-size="12" text-anchor="middle" fill="#4f5d75">예</text></g><g class="edge-label"><rect x="458" y="460" width="52" height="20" rx="2" fill="#f5f5f5"/><text x="484" y="476" font-size="12" text-anchor="middle" fill="#4f5d75">아니오</text></g><g data-node="artifact"><rect x="488" y="64" width="304" height="72" rx="6" fill="#f5f5f5"/><rect x="488" y="64" width="304" height="72" rx="6" fill="#fff" stroke="#2d3142"/><text x="640.0" y="96" font-size="16" text-anchor="middle" fill="#2d3142">현재 단계 산출물</text><text x="640.0" y="120" font-size="12" text-anchor="middle" fill="#4f5d75">plans / spec / impl_plans</text></g><g data-node="review"><rect x="488" y="188" width="304" height="80" rx="6" fill="#f5f5f5"/><rect x="488" y="188" width="304" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="640.0" y="220" font-size="16" text-anchor="middle" fill="#2d3142">관점별 독립 리뷰 · 병렬</text><text x="640.0" y="252" font-size="12" text-anchor="middle" fill="#4f5d75">분할 작성이면 교차정합 추가</text></g><g data-node="triage"><rect x="488" y="324" width="304" height="72" rx="6" fill="#f5f5f5"/><rect x="488" y="324" width="304" height="72" rx="6" fill="#fff" stroke="#2d3142"/><text x="640.0" y="356" font-size="16" text-anchor="middle" fill="#2d3142">허브의 타당성·범위 판정</text><text x="640.0" y="380" font-size="12" text-anchor="middle" fill="#4f5d75">문서 결함 / 확장 제안 구분</text></g><g data-node="gate"><polygon points="640,440 728,488 640,536 552,488" fill="#f5f5f5" stroke="#eb6c36"/><text x="640" y="484" font-size="16" text-anchor="middle" fill="#2d3142">수렴?</text><text x="640" y="508" font-size="12" text-anchor="middle" fill="#4f5d75">차단급 0 · 처리 완료</text></g><g data-node="next"><rect x="944" y="448" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="944" y="448" width="240" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="1064.0" y="480" font-size="16" text-anchor="middle" fill="#2d3142">다음 단계로 인계</text><text x="1064.0" y="512" font-size="12" text-anchor="middle" fill="#4f5d75">미처리 계약 요청 0</text></g><g data-node="fix"><rect x="176" y="448" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="176" y="448" width="240" height="80" rx="6" fill="#fff" stroke="#2d3142"/><text x="296.0" y="480" font-size="16" text-anchor="middle" fill="#2d3142">정본·계약 수정</text><text x="296.0" y="512" font-size="12" text-anchor="middle" fill="#4f5d75">영향 범위 재리뷰</text></g><g data-node="backlog"><rect x="944" y="324" width="240" height="72" rx="6" fill="#f5f5f5"/><rect x="944" y="324" width="240" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="1064.0" y="356" font-size="16" text-anchor="middle" fill="#2d3142">격리된 backlog</text><text x="1064.0" y="380" font-size="12" text-anchor="middle" fill="#4f5d75">목표에 불필요한 확장</text></g><line x1="40" y1="672" x2="1240" y2="672" stroke="#bfc0c0"/><text x="40" y="700" font-size="12" text-anchor="start" fill="#4f5d75">실선: 처리·인계  /  점선: 선택·복귀·응답  /  주황: 핵심 판단 또는 결과</text></svg>
